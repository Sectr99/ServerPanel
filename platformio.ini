[platformio]
extra_configs = ota.ini  ; [ota]: IP and password for Wi-Fi flashing (git-ignored; see ota.example.ini)
default_envs = p4

; Waveshare ESP32-P4-WIFI6-Touch-LCD-7B: ESP32-P4 rev 3.2 + ESP32-C6 (Wi-Fi over SDIO, handled by the core),
; 1024x600 MIPI-DSI, GT911 touch, 32 MB flash (16 MB used: past that needs 4-byte addressing). UART port = CH343 (COM6 here); built-in USB port = 303A:1001.
; Over-the-air updates: after one USB flash of this firmware, `pio run -e p4-ota -t upload` flashes over Wi-Fi.
[env:p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-p4_r3
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv  ; 2 x 6 MB OTA app slots + ~3.9 MB LittleFS
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0  ; Serial on the UART port (CH343); set 1 to log on the built-in USB port instead
  '-DOTA_HOST="${ota.host}"'
  '-DOTA_PASSWORD="${ota.password}"'
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src  ; USB library's MSC files include FS.h
monitor_speed = 115200
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8

[env:p4-ota]
extends = env:p4
upload_protocol = espota
upload_port = ${ota.ip}
upload_flags = --auth=${ota.password}
